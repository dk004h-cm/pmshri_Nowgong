<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marksheet Lookup | PM SHRI GOVT GIRLS HSS</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh; 
            margin: 0; 
            
            /* Background using your uploaded image */
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('1000411201.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .container { 
            background: rgba(255, 255, 255, 0.92); 
            padding: 2.5rem; 
            border-radius: 15px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
            text-align: center;
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h2 { color: #d32f2f; margin-bottom: 0.5rem; font-size: 1.4rem; font-weight: 800; text-transform: uppercase; }
        .subtitle { color: #1976d2; margin-bottom: 1.5rem; font-weight: bold; font-size: 1rem; border-bottom: 2px solid #1976d2; padding-bottom: 10px; }
        
        input { 
            padding: 14px; 
            width: calc(100% - 32px); 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            font-size: 16px; 
            margin-bottom: 15px;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: #1976d2; box-shadow: 0 0 8px rgba(25, 118, 210, 0.2); }

        button { 
            padding: 14px; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            width: 100%; 
            transition: 0.3s;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #viewBtn { background-color: #1976d2; }
        #viewBtn:hover { background-color: #1565c0; transform: translateY(-2px); }

        #printBtn { background-color: #2e7d32; display: none; }
        #printBtn:hover { background-color: #1b5e20; transform: translateY(-2px); }
        
        .history-section { margin-top: 25px; text-align: left; border-top: 2px dashed #eee; padding-top: 15px; }
        .history-title { font-size: 0.8rem; color: #666; margin-bottom: 10px; display: flex; justify-content: space-between; letter-spacing: 1px; font-weight: bold; }
        .history-item { 
            display: block; padding: 10px; background: #f8f9fa; margin-bottom: 6px;
            border-radius: 6px; font-size: 0.9rem; color: #333; text-decoration: none;
            border: 1px solid #e0e0e0; transition: 0.2s;
        }
        .history-item:hover { background: #e3f2fd; border-color: #1976d2; color: #1976d2; }
        .clear-btn { color: #c62828; cursor: pointer; text-decoration: none; font-size: 0.75rem; }
        .clear-btn:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>PM SHRI GOVT GIRLS HSS NOWGONG</h2>
    <div class="subtitle">RESULT SEARCH 2026</div>
    
    <input type="text" id="idInput" placeholder="Enter Roll Number" autocomplete="off">
    <button id="viewBtn" onclick="openMarksheet()">🔍 View Marksheet</button>
    <button id="printBtn" onclick="printMarksheet()">🖨️ Print Marksheet</button>
    
    <div class="history-section" id="historySection" style="display: none;">
        <div class="history-title">
            RECENT SEARCHES 
            <span class="clear-btn" onclick="clearHistory()">Clear All</span>
        </div>
        <div id="historyList"></div>
    </div>
</div>

<script>
    const baseUrl = "https://ems.educationportal3.in/public/marksheet/";

    window.onload = displayHistory;

    function openMarksheet() {
        const id = document.getElementById('idInput').value.trim();
        if (id && id.length > 5) {
            saveToHistory(id);
            document.getElementById('printBtn').style.display = 'flex';
            window.open(baseUrl + id, '_blank');
            displayHistory();
        } else {
            alert("Please enter a valid Roll number.");
        }
    }

    function printMarksheet() {
        const id = document.getElementById('idInput').value.trim();
        if (id) {
            window.open(baseUrl + id, '_blank');
            setTimeout(() => {
                alert("Once the page loads, press CTRL + P to print.");
            }, 500);
        }
    }

    function saveToHistory(id) {
        let history = JSON.parse(localStorage.getItem('searchHistory')) || [];
        if (!history.includes(id)) {
            history.unshift(id);
            if (history.length > 5) history.pop();
            localStorage.setItem('searchHistory', JSON.stringify(history));
        }
    }

    function displayHistory() {
        const history = JSON.parse(localStorage.getItem('searchHistory')) || [];
        const container = document.getElementById('historySection');
        const list = document.getElementById('historyList');
        if (history.length > 0) {
            container.style.display = 'block';
            list.innerHTML = history.map(id => 
                `<a href="${baseUrl}${id}" target="_blank" class="history-item">📄 Roll No: ${id}</a>`
            ).join('');
        } else { container.style.display = 'none'; }
    }

    function clearHistory() {
        localStorage.removeItem('searchHistory');
        displayHistory();
    }

    document.getElementById('idInput').addEventListener("keypress", (e) => {
        if (e.key === "Enter") openMarksheet();
    });
</script>

</body>
</html>
